[package]
name = "reel-automator"
version = "0.1.0"
description = "Reels EDL Automator"
authors = []
license = ""
repository = ""
default-run = "reel-automator"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "reel_automator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "reel-automator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"

# Unix-only: send SIGTERM to the engine sidecar on cancel (see whisper.rs
# cancel_transcription) so the PyInstaller worker child shuts down cleanly.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"

[profile.dev]
incremental = true
