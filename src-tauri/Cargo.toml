[package]
name = "reel-automator"
version = "0.1.0"
description = "Reels EDL Automator"
authors = []
license = ""
repository = ""
default-run = "reel-automator"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "reel_automator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "reel-automator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
# OS credential-store backends (S-11). keyring 3.x ships NO credential store by
# default (silently falls back to an in-memory mock, so keys vanish each launch);
# `apple-native` links macOS Security framework, `windows-native` the Windows
# Credential Manager, so secrets actually persist to the OS keychain per platform.
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }

# Unix-only: send SIGTERM to the engine sidecar on cancel (see whisper.rs
# cancel_transcription) so the PyInstaller worker child shuts down cleanly.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows-only: DXGI adapter enumeration (deps.rs `dxgi_adapters`) so the app can
# SEE an AMD/Intel card and say so in Polish, instead of only reporting the NVIDIA
# it didn't find. Reporting signal only — it never influences variant selection.
# Pinned to the 0.61 line Tauri already pulls in transitively, so this reuses the
# compiled crate rather than adding a second copy of `windows` to the build.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# S-21: unwind (not abort) so a panic in a packaged build is contained and caught
# by the lib.rs panic hook, the same way dev does — abort silently killed the
# whole process on any panic.
panic = "unwind"

[profile.dev]
incremental = true
